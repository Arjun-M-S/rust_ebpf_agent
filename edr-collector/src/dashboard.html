<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDR Collector</title>
<style>
  /* Single dark theme, deliberately. This is a console that gets left open on a
     wall display in a dim room, not a document. */
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232c;
    --line: #2a323d;
    --text: #d7dee7;
    --dim: #8b98a8;
    --faint: #5d6975;
    --crit: #ff5c5c;
    --high: #ff9d43;
    --med: #ffd056;
    --ok: #4ec98a;
    --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 {
    font-size: 14px; font-weight: 600; margin: 0;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .spacer { flex: 1; }
  .meta { color: var(--dim); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.live { background: var(--ok); }
  .dot.stale { background: var(--crit); }

  button, select, input {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 9px; font: inherit; font-size: 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  input { min-width: 200px; }

  #banner {
    display: none;
    margin: 0; padding: 11px 20px;
    background: rgba(255,92,92,.12);
    border-bottom: 1px solid var(--crit);
    color: var(--crit);
    font-weight: 600;
  }
  #banner.show { display: block; }

  .tiles {
    display: grid; gap: 1px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    background: var(--line);
    border-bottom: 1px solid var(--line);
  }
  .tile { background: var(--panel); padding: 14px 18px; }
  .tile .k {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint);
  }
  .tile .v { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .tile .v.bad { color: var(--crit); }
  .tile .v.good { color: var(--ok); }

  .wrap { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  aside {
    border-right: 1px solid var(--line);
    padding: 14px 0;
    background: var(--panel);
  }
  .side-h {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); padding: 0 18px 8px;
  }
  .host {
    padding: 8px 18px; cursor: pointer;
    border-left: 2px solid transparent;
  }
  .host:hover { background: var(--panel-2); }
  .host.sel { border-left-color: var(--accent); background: var(--panel-2); }
  .host .n { display: flex; align-items: center; gap: 7px; }
  .host .s { color: var(--faint); font-size: 11px; margin-top: 2px; }

  main { padding: 14px 20px 60px; min-width: 0; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 10px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--faint);
    padding: 7px 10px; border-bottom: 1px solid var(--line);
    position: sticky; top: 49px; background: var(--bg);
  }
  tbody td {
    padding: 7px 10px; border-bottom: 1px solid var(--panel-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 260px;
  }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel); }
  tbody tr.unver { background: rgba(255,92,92,.07); }

  .sev { font-weight: 700; font-size: 11px; letter-spacing: .05em; }
  .sev.CRITICAL { color: var(--crit); }
  .sev.HIGH { color: var(--high); }
  .sev.MEDIUM { color: var(--med); }
  .sev.INFO { color: var(--dim); }

  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px;
    border: 1px solid currentColor;
  }
  .badge.y { color: var(--ok); }
  .badge.n { color: var(--crit); font-weight: 700; }

  .empty { color: var(--faint); padding: 40px 10px; text-align: center; }

  /* Detail drawer */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 18px 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform .16s ease-out;
    z-index: 20;
  }
  #drawer.open { transform: none; }
  #drawer h2 { font-size: 13px; margin: 0 0 14px; letter-spacing: .06em; text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 5px 12px; }
  .kv dt { color: var(--faint); font-size: 11px; }
  .kv dd {
    margin: 0; word-break: break-all; white-space: pre-wrap;
    font-size: 12px;
  }
  #close { position: absolute; top: 14px; right: 16px; }
</style>
</head>
<body>

<header>
  <h1>EDR Collector</h1>
  <span class="meta"><span class="dot live" id="pulse"></span> <span id="updated">connecting</span></span>
  <span class="spacer"></span>
  <button id="refresh">Refresh</button>
  <button id="auto" class="on">Auto 5s</button>
</header>

<p id="banner"></p>

<div class="tiles" id="tiles"></div>

<div class="wrap">
  <aside>
    <div class="side-h">Hosts</div>
    <div id="hosts"></div>
  </aside>

  <main>
    <div class="bar">
      <select id="sev">
        <option value="">All severities</option>
        <option value="CRITICAL">CRITICAL</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="INFO">INFO</option>
      </select>
      <input id="q" placeholder="filter process, parent, path, user">
      <button id="all">Show INFO</button>
      <button id="clear">Clear host filter</button>
      <span class="meta" id="count"></span>
    </div>
    <table>
      <thead><tr>
        <th>Received</th><th>Host</th><th>Sev</th><th>Process</th>
        <th>Parent</th><th>UID</th><th>PID</th><th>Seq</th><th>Seal</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No alerts in the current window.</div>
  </main>
</div>

<div id="drawer">
  <button id="close">Close</button>
  <h2 id="dtitle">Event</h2>
  <dl class="kv" id="dbody"></dl>
</div>

<script>
"use strict";
/*
  EVERY string below originates from a process name, a parent name, or a file
  path on a monitored host -- i.e. it is chosen by whoever ran the binary. An
  attacker who can exec a file can name it anything, including markup. So this
  file builds DOM nodes and assigns textContent. There is no innerHTML, no
  insertAdjacentHTML, no template interpolation into markup, anywhere. Keep it
  that way: the reader of this page is a SOC analyst, which makes it the most
  valuable XSS target on the network.
*/

const state = {
  host: "",        // selected host, "" = fleet
  sev: "",
  q: "",
  all: false,      // include INFO
  auto: true,
  rows: [],
};

const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}

function shortTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toISOString().replace("T", " ").slice(0, 19);
}

function ago(iso) {
  if (!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (isNaN(s)) return iso;
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

// ---------- rendering ----------

function renderTiles(fleet, hosts) {
  const unver = state.rows.filter((r) => r.verified === false).length;
  const crit = state.rows.filter((r) => r.severity === "CRITICAL").length;
  const mism = hosts.filter((h) => h.build_mismatch).length;

  const defs = [
    ["Hosts", fleet.enrolled, ""],
    ["Silent", fleet.silent, fleet.silent > 0 ? "bad" : "good"],
    ["Records", fleet.total_records, ""],
    ["Chain breaks", fleet.total_breaks, fleet.total_breaks > 0 ? "bad" : "good"],
    ["Unsealed in view", unver, unver > 0 ? "bad" : "good"],
    ["Critical in view", crit, crit > 0 ? "bad" : ""],
    ["Build mismatch", mism, mism > 0 ? "bad" : "good"],
  ];

  const box = $("tiles");
  box.replaceChildren();
  for (const [k, v, cls] of defs) {
    const t = el("div", "tile");
    t.append(el("div", "k", k), el("div", "v " + cls, v));
    box.append(t);
  }
}

function renderBanner(fleet, hosts) {
  const b = $("banner");
  const problems = [];
  if (fleet.total_breaks > 0) {
    problems.push(fleet.total_breaks + " chain break(s) recorded — evidence was altered, deleted, or forged");
  }
  if (fleet.silent > 0) {
    problems.push(fleet.silent + " host(s) silent — an agent stopped reporting");
  }
  const mism = hosts.filter((h) => h.build_mismatch);
  if (mism.length) {
    problems.push(mism.length + " host(s) running an unenrolled agent binary");
  }
  if (problems.length) {
    b.textContent = "INTEGRITY ALERT: " + problems.join("  ·  ");
    b.classList.add("show");
  } else {
    b.classList.remove("show");
  }
}

function renderHosts(hosts) {
  const box = $("hosts");
  box.replaceChildren();

  const allRow = el("div", "host" + (state.host === "" ? " sel" : ""));
  const allName = el("div", "n");
  allName.append(el("span", null, "All hosts"));
  allRow.append(allName, el("div", "s", hosts.length + " enrolled"));
  allRow.onclick = () => { state.host = ""; refresh(); };
  box.append(allRow);

  for (const h of hosts) {
    const row = el("div", "host" + (state.host === h.host ? " sel" : ""));
    const name = el("div", "n");
    const dot = el("span", "dot " + (h.silent ? "stale" : "live"));
    name.append(dot, el("span", null, h.host));
    row.append(name);

    const bits = [ago(h.last_seen), "seq " + h.high_seq];
    if (h.breaks > 0) bits.push(h.breaks + " break(s)");
    if (h.build_mismatch) bits.push("build mismatch");
    row.append(el("div", "s", bits.join(" · ")));

    row.onclick = () => { state.host = h.host; refresh(); };
    box.append(row);
  }
}

function matchesQuery(r) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return ["process_name", "parent_process_name", "filename", "host", "event_type", "detail"]
    .some((k) => String(r[k] || "").toLowerCase().includes(q));
}

function renderRows() {
  const body = $("rows");
  body.replaceChildren();

  const shown = state.rows.filter(matchesQuery);
  $("count").textContent = shown.length + " shown";
  $("empty").hidden = shown.length > 0;

  for (const r of shown) {
    const tr = el("tr", r.verified === false ? "unver" : "");

    tr.append(el("td", null, shortTime(r.received_at)));
    tr.append(el("td", null, r.host));

    const sev = el("td");
    sev.append(el("span", "sev " + (r.severity || "INFO"), r.severity || "INFO"));
    tr.append(sev);

    // Collector markers have no process; show what happened instead.
    if (r.kind === "collector") {
      const td = el("td", null, r.event_type);
      td.colSpan = 2;
      tr.append(td);
    } else {
      tr.append(el("td", null, r.process_name));
      tr.append(el("td", null, r.parent_process_name));
    }

    tr.append(el("td", null, r.kind === "collector" ? "" : r.uid));
    tr.append(el("td", null, r.kind === "collector" ? "" : r.pid));
    tr.append(el("td", null, r.seq));

    const seal = el("td");
    seal.append(
      r.verified
        ? el("span", "badge y", "sealed")
        : el("span", "badge n", "UNSEALED")
    );
    tr.append(seal);

    tr.onclick = () => openDrawer(r);
    body.append(tr);
  }
}

const FIELDS = [
  ["Kind", "kind"], ["Host", "host"], ["Severity", "severity"],
  ["Received (collector clock)", "received_at"],
  ["Event time (host clock)", "timestamp"],
  ["Event", "event_type"], ["Detail", "detail"],
  ["Process", "process_name"], ["Parent", "parent_process_name"],
  ["Path", "filename"], ["Binary id", "binary_id"],
  ["UID", "uid"], ["PID", "pid"], ["PPID", "ppid"], ["cgroup", "cgroup_id"],
  ["Seq", "seq"], ["Epoch", "epoch"], ["Segment", "segment"],
  ["Expected seq", "expected_seq"], ["Expected prev hash", "expected_prev_hash"],
  ["Enrolled build", "expected_build"], ["Reported build", "reported_build"],
  ["MAC", "hash"], ["Prev MAC", "prev_hash"],
];

function openDrawer(r) {
  $("dtitle").textContent = r.kind === "collector"
    ? r.event_type + " · " + r.host
    : (r.process_name || "event") + " · " + r.host;

  const dl = $("dbody");
  dl.replaceChildren();

  const seal = el("dd");
  seal.append(r.verified ? el("span", "badge y", "MAC verified against escrowed K0")
                         : el("span", "badge n", "NOT VERIFIED — treat contents as attacker-controlled"));
  dl.append(el("dt", null, "Seal"), seal);

  for (const [label, key] of FIELDS) {
    const v = r[key];
    if (v === undefined || v === null || v === "") continue;
    dl.append(el("dt", null, label), el("dd", null, v));
  }
  $("drawer").classList.add("open");
}

// ---------- data ----------

async function refresh() {
  try {
    const params = new URLSearchParams();
    if (state.host) params.set("host", state.host);
    if (state.sev) params.set("severity", state.sev);
    // "true", not "1": serde_urlencoded only accepts the spelled-out form for
    // a bool, and a rejected query means the whole request 400s.
    if (state.all) params.set("all", "true");
    params.set("limit", "500");

    const [ov, al] = await Promise.all([
      fetch("api/overview").then((r) => r.json()),
      fetch("api/alerts?" + params.toString()).then((r) => r.json()),
    ]);

    state.rows = Array.isArray(al.alerts) ? al.alerts : [];
    renderHosts(ov.hosts || []);
    renderTiles(ov.fleet || {}, ov.hosts || []);
    renderBanner(ov.fleet || {}, ov.hosts || []);
    renderRows();

    $("updated").textContent = "updated " + shortTime(new Date().toISOString());
    $("pulse").className = "dot live";
  } catch (e) {
    // A dead collector must look dead, not look quiet.
    $("updated").textContent = "collector unreachable";
    $("pulse").className = "dot stale";
  }
}

// ---------- wiring ----------

$("refresh").onclick = refresh;
$("clear").onclick = () => { state.host = ""; refresh(); };
$("sev").onchange = (e) => { state.sev = e.target.value; refresh(); };
$("q").oninput = (e) => { state.q = e.target.value; renderRows(); };
$("close").onclick = () => $("drawer").classList.remove("open");
document.onkeydown = (e) => { if (e.key === "Escape") $("drawer").classList.remove("open"); };

$("all").onclick = (e) => {
  state.all = !state.all;
  e.target.classList.toggle("on", state.all);
  refresh();
};

let timer = null;
function setAuto(on) {
  state.auto = on;
  $("auto").classList.toggle("on", on);
  if (timer) clearInterval(timer);
  timer = on ? setInterval(refresh, 5000) : null;
}
$("auto").onclick = () => setAuto(!state.auto);

setAuto(true);
refresh();
</script>
</body>
</html>
