<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDR Collector</title>
<style>
  /* Single dark theme, deliberately. This is a console that gets left open on a
     wall display in a dim room, not a document. */
  :root {
    --bg: #0b0e13;
    --panel: #141a23;
    --panel-2: #1b232e;
    --line: #262f3c;
    --text: #dbe3ee;
    --dim: #8b98a8;
    --faint: #5d6975;
    --crit: #ff5c6c;
    --high: #ff9d43;
    --med: #ffd056;
    --ok: #3ddc97;
    --accent: #5aa9ff;
    --violet: #a78bfa;
    --card: linear-gradient(180deg, #161d27 0%, #111721 100%);
    --hdr: 53px;   /* header height: 13 + 26 + 13 + 1px border */
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.9);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* Depth, so the page doesn't read as a stack of grey rectangles. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(90,169,255,.13), transparent 65%),
      radial-gradient(700px 460px at 92% 0%, rgba(167,139,250,.10), transparent 60%),
      radial-gradient(800px 600px at 50% 110%, rgba(61,220,151,.06), transparent 60%);
  }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 22px;
    background: rgba(15,20,28,.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(140deg, var(--accent), var(--violet));
    box-shadow: 0 0 18px -4px rgba(90,169,255,.7);
    display: grid; place-items: center;
    font: 700 13px/1 system-ui, sans-serif; color: #0b0e13;
  }
  header h1 {
    font: 600 14px/1 system-ui, -apple-system, sans-serif; margin: 0;
    letter-spacing: .14em; text-transform: uppercase;
    background: linear-gradient(90deg, #eaf2ff, #9fc6ff 60%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .spacer { flex: 1; }
  .meta { color: var(--dim); font-size: 12px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,151,.55); animation: ping 2.4s ease-out infinite; }
  .dot.stale { background: var(--crit); box-shadow: 0 0 8px rgba(255,92,108,.8); }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(61,220,151,.5); }
    70%  { box-shadow: 0 0 0 7px rgba(61,220,151,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); }
  }

  button, select, input {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; font: inherit; font-size: 12px;
    transition: border-color .15s, color .15s, background .15s, transform .1s;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); color: #fff; }
  button:active { transform: translateY(1px); }
  button.on {
    border-color: rgba(90,169,255,.6); color: var(--accent);
    background: rgba(90,169,255,.10);
    box-shadow: 0 0 16px -6px rgba(90,169,255,.9);
  }
  input { min-width: 230px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  #banner {
    display: none; margin: 0; padding: 12px 22px;
    background: linear-gradient(90deg, rgba(255,92,108,.20), rgba(255,92,108,.06));
    border-bottom: 1px solid rgba(255,92,108,.55);
    color: #ffb3bb; font-weight: 600;
    animation: alarm 2.2s ease-in-out infinite;
  }
  #banner.show { display: block; }
  @keyframes alarm { 0%,100% { box-shadow: inset 0 0 0 rgba(255,92,108,0); } 50% { box-shadow: inset 0 -40px 40px -40px rgba(255,92,108,.45); } }

  .pad { padding: 16px 22px 0; }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); }
  .charts { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 12px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
    position: relative;
    /* clip, not hidden: `hidden` would make this card the sticky thead's
       scroll container and float the header row into the middle of the log. */
    overflow: clip;
  }
  .card::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
  }
  .k {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint);
  }
  .tile .v {
    font: 700 27px/1.1 system-ui, sans-serif; margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .tile .v.bad  { color: var(--crit); text-shadow: 0 0 22px rgba(255,92,108,.45); }
  .tile .v.good { color: var(--ok); }
  .tile { transition: transform .15s, border-color .15s; }
  .tile:hover { transform: translateY(-2px); border-color: #33405120; }
  .spark { display: block; width: 100%; height: 26px; margin-top: 6px; }

  /* ---- donuts ---- */
  .chart { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .donut { width: 104px; height: 104px; flex: none; overflow: visible; }
  .donut circle { transition: stroke-width .15s, opacity .15s; }
  .donut circle.seg:hover { stroke-width: 5.4; }
  .donut .ctr-v { font: 700 8px/1 system-ui, sans-serif; fill: var(--text); }
  .donut .ctr-k { font: 500 2.9px/1 system-ui, sans-serif; fill: var(--faint); letter-spacing: .18em; }
  .legend { flex: 1; min-width: 0; display: grid; gap: 5px; align-content: center; }
  .lg { display: flex; align-items: center; gap: 7px; font-size: 11.5px; cursor: default; }
  .lg .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .lg .lb { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .lg .nu { font-variant-numeric: tabular-nums; color: var(--text); }
  .lg .pc { color: var(--faint); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .lg:hover .lb { color: var(--text); }

  /* ---- top-process bars ---- */
  .bars { display: grid; gap: 8px; margin-top: 12px; }
  .brow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 11.5px; }
  .brow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .ct { color: var(--dim); font-variant-numeric: tabular-nums; }
  .track { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; transition: width .5s cubic-bezier(.22,1,.36,1); }

  .wrap { display: grid; grid-template-columns: 262px 1fr; gap: 12px; padding: 12px 22px 60px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  aside { padding: 14px 0 8px; }
  .side-h { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 0 16px 10px; }
  .host {
    padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .host:hover { background: var(--panel-2); }
  .host.sel {
    border-left-color: var(--accent);
    background: linear-gradient(90deg, rgba(90,169,255,.14), transparent);
  }
  .host .n { display: flex; align-items: center; gap: 8px; }
  .host .s { color: var(--faint); font-size: 11px; margin-top: 2px; }

  main { min-width: 0; padding: 0; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

  .tablecard { padding: 4px 4px 6px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint);
    padding: 9px 10px; border-bottom: 1px solid var(--line);
    position: sticky; top: var(--hdr); background: #171e28; z-index: 5;
  }
  tbody td {
    padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.04);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 260px;
  }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: rgba(90,169,255,.07); }
  tbody tr.unver { background: rgba(255,92,108,.08); box-shadow: inset 2px 0 0 var(--crit); }
  tbody tr.unver:hover { background: rgba(255,92,108,.14); }

  .sev {
    font-weight: 700; font-size: 10px; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor;
  }
  .sev.CRITICAL { color: var(--crit); background: rgba(255,92,108,.12); }
  .sev.HIGH     { color: var(--high); background: rgba(255,157,67,.12); }
  .sev.MEDIUM   { color: var(--med);  background: rgba(255,208,86,.12); }
  .sev.INFO     { color: var(--dim);  background: rgba(139,152,168,.10); }

  .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.y { color: var(--ok); background: rgba(61,220,151,.10); }
  .badge.n { color: var(--crit); background: rgba(255,92,108,.12); font-weight: 700; }

  .empty { color: var(--faint); padding: 44px 10px; text-align: center; }

  /* Detail drawer */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
    background: linear-gradient(180deg, #161d27, #0f141c);
    border-left: 1px solid var(--line);
    box-shadow: -30px 0 60px -30px rgba(0,0,0,.9);
    padding: 18px 20px; overflow-y: auto;
    transform: translateX(100%); transition: transform .22s cubic-bezier(.22,1,.36,1);
    z-index: 20;
  }
  #drawer.open { transform: none; }
  #drawer h2 { font: 600 13px/1.4 system-ui, sans-serif; margin: 0 0 14px; letter-spacing: .06em; text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; }
  .kv dt { color: var(--faint); font-size: 11px; }
  .kv dd { margin: 0; word-break: break-all; white-space: pre-wrap; font-size: 12px; }
  #close { position: absolute; top: 14px; right: 16px; }
</style>
</head>
<body>

<header>
  <span class="mark">E</span>
  <h1>EDR Collector</h1>
  <span class="meta"><span class="dot live" id="pulse"></span> <span id="updated">connecting</span></span>
  <span class="spacer"></span>
  <button id="refresh">Refresh</button>
  <button id="auto" class="on">Auto 5s</button>
</header>

<p id="banner"></p>

<div class="pad">
  <div class="grid tiles" id="tiles"></div>
  <p class="meta" id="anchorbar"></p>
  <div class="grid charts" id="charts"></div>
</div>

<div class="wrap">
  <aside class="card">
    <div class="side-h">Hosts</div>
    <div id="hosts"></div>
  </aside>

  <main>
    <div class="bar">
      <select id="sev">
        <option value="">All severities</option>
        <option value="CRITICAL">CRITICAL</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="INFO">INFO</option>
      </select>
      <input id="q" placeholder="filter process, parent, path, user">
      <button id="all">Show INFO</button>
      <button id="clear">Clear host filter</button>
      <span class="spacer"></span>
      <span class="meta" id="count"></span>
    </div>
    <div class="card tablecard">
      <table>
        <thead><tr>
          <th>Received</th><th>Host</th><th>Sev</th><th>Process</th>
          <th>Parent</th><th>UID</th><th>PID</th><th>Seq</th><th>Seal</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No alerts in the current window.</div>
    </div>
  </main>
</div>

<div id="drawer">
  <button id="close">Close</button>
  <h2 id="dtitle">Event</h2>
  <dl class="kv" id="dbody"></dl>
</div>

<script>
"use strict";
/*
  EVERY string below originates from a process name, a parent name, or a file
  path on a monitored host -- i.e. it is chosen by whoever ran the binary. An
  attacker who can exec a file can name it anything, including markup. So this
  file builds DOM nodes and assigns textContent. There is no innerHTML, no
  insertAdjacentHTML, no template interpolation into markup, anywhere. Keep it
  that way: the reader of this page is a SOC analyst, which makes it the most
  valuable XSS target on the network.
*/

const state = {
  host: "",        // selected host, "" = fleet
  sev: "",
  q: "",
  all: false,      // include INFO
  auto: true,
  rows: [],
  hosts: [],
};

const $ = (id) => document.getElementById(id);
const CSSVAR = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function shortTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toISOString().replace("T", " ").slice(0, 19);
}

function ago(iso) {
  if (!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (isNaN(s)) return iso;
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

// ---------- charts ----------

// r chosen so the circumference is exactly 100 -- then stroke-dasharray is
// literally "percent drawn, percent gap" and no arc maths is needed.
const R = 15.9155;

/* segs: [{label, value, color}]. Draws a donut plus a legend into `card`. */
function donut(card, title, segs, centerLabel) {
  const total = segs.reduce((a, s) => a + s.value, 0);

  card.replaceChildren(el("div", "k", title));
  const chart = el("div", "chart");
  const s = svg("svg", { class: "donut", viewBox: "0 0 42 42" });

  s.append(svg("circle", {
    cx: 21, cy: 21, r: R, fill: "none",
    stroke: CSSVAR("--panel-2"), "stroke-width": 4,
  }));

  let offset = 0;
  const drawn = [];
  for (const seg of segs) {
    if (!seg.value) continue;
    const pct = (seg.value / total) * 100;
    const c = svg("circle", {
      class: "seg", cx: 21, cy: 21, r: R, fill: "none",
      stroke: seg.color, "stroke-width": 4, "stroke-linecap": "butt",
      "stroke-dasharray": pct.toFixed(3) + " " + (100 - pct).toFixed(3),
      // -25 puts the start of the ring at 12 o'clock instead of 3 o'clock.
      "stroke-dashoffset": (25 - offset).toFixed(3),
    });
    // Native tooltip; setAttribute on <title> text is textContent, not markup.
    c.append(Object.assign(svg("title"), { textContent: seg.label + ": " + seg.value }));
    s.append(c);
    drawn.push([c, pct]);
    offset += pct;
  }

  const v = svg("text", { class: "ctr-v", x: 21, y: 20.6, "text-anchor": "middle" });
  v.textContent = total;
  const k = svg("text", { class: "ctr-k", x: 21, y: 25, "text-anchor": "middle" });
  k.textContent = centerLabel.toUpperCase();
  s.append(v, k);

  const legend = el("div", "legend");
  for (const seg of segs) {
    const row = el("div", "lg");
    const sw = el("span", "sw");
    sw.style.background = seg.color;
    sw.style.boxShadow = "0 0 8px -1px " + seg.color;
    row.append(sw, el("span", "lb", seg.label), el("span", "nu", seg.value),
               el("span", "pc", total ? Math.round((seg.value / total) * 100) + "%" : "—"));
    legend.append(row);
  }

  chart.append(s, legend);
  card.append(chart);

  // Sweep the ring in on draw. Cheap, and it makes a changed mix obvious.
  for (const [c, pct] of drawn) {
    c.animate(
      [{ strokeDasharray: "0 100" }, { strokeDasharray: pct.toFixed(3) + " " + (100 - pct).toFixed(3) }],
      { duration: 550, easing: "cubic-bezier(.22,1,.36,1)" },
    );
  }
}

function barlist(card, title, pairs, color) {
  card.replaceChildren(el("div", "k", title));
  const box = el("div", "bars");
  const max = pairs.length ? pairs[0][1] : 1;
  for (const [name, n] of pairs) {
    const row = el("div", "brow");
    row.append(el("div", "nm", name), el("div", "ct", n));
    const track = el("div", "track");
    const fill = el("div", "fill");
    fill.style.width = Math.max(3, (n / max) * 100) + "%";
    fill.style.background = "linear-gradient(90deg," + color + "," + CSSVAR("--violet") + ")";
    track.append(fill);
    row.append(track);
    box.append(row);
  }
  if (!pairs.length) box.append(el("div", "empty", "nothing yet"));
  card.append(box);
}

/* Alert volume over the last hour, one point per minute. */
function sparkline(mount) {
  const now = Date.now(), bins = new Array(60).fill(0);
  for (const r of state.rows) {
    const t = new Date(r.received_at).getTime();
    if (isNaN(t)) continue;
    const m = Math.floor((now - t) / 60000);
    if (m >= 0 && m < 60) bins[59 - m]++;
  }
  const max = Math.max(1, ...bins);
  const s = svg("svg", { class: "spark", viewBox: "0 0 120 26", preserveAspectRatio: "none" });
  const pts = bins.map((v, i) => (i * 120 / 59).toFixed(2) + "," + (25 - (v / max) * 23).toFixed(2));
  const g = svg("linearGradient", { id: "sg", x1: 0, y1: 0, x2: 0, y2: 1 });
  g.append(svg("stop", { offset: 0, "stop-color": CSSVAR("--accent"), "stop-opacity": .45 }),
           svg("stop", { offset: 1, "stop-color": CSSVAR("--accent"), "stop-opacity": 0 }));
  const defs = svg("defs"); defs.append(g);
  s.append(defs,
    svg("polygon", { points: "0,26 " + pts.join(" ") + " 120,26", fill: "url(#sg)" }),
    svg("polyline", { points: pts.join(" "), fill: "none", stroke: CSSVAR("--accent"),
                      "stroke-width": 1.4, "stroke-linejoin": "round" }));
  mount.append(s);
}

function count(rows, key) {
  const m = new Map();
  for (const r of rows) {
    const v = r[key];
    if (!v) continue;
    m.set(v, (m.get(v) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function renderCharts(fleet) {
  const box = $("charts");
  box.replaceChildren();
  const mk = () => { const c = el("div", "card"); box.append(c); return c; };

  const by = (s) => state.rows.filter((r) => (r.severity || "INFO") === s).length;
  donut(mk(), "Severity mix · in view", [
    { label: "CRITICAL", value: by("CRITICAL"), color: CSSVAR("--crit") },
    { label: "HIGH",     value: by("HIGH"),     color: CSSVAR("--high") },
    { label: "MEDIUM",   value: by("MEDIUM"),   color: CSSVAR("--med") },
    { label: "INFO",     value: by("INFO"),     color: CSSVAR("--dim") },
  ], "events");

  const sealed = state.rows.filter((r) => r.verified).length;
  donut(mk(), "Seal integrity · in view", [
    { label: "MAC verified", value: sealed, color: CSSVAR("--ok") },
    { label: "UNSEALED", value: state.rows.length - sealed, color: CSSVAR("--crit") },
  ], "records");

  const silent = state.hosts.filter((h) => h.silent).length;
  const mism = state.hosts.filter((h) => h.build_mismatch && !h.silent).length;
  donut(mk(), "Fleet health", [
    { label: "Reporting", value: state.hosts.length - silent - mism, color: CSSVAR("--ok") },
    { label: "Build mismatch", value: mism, color: CSSVAR("--high") },
    { label: "Silent", value: silent, color: CSSVAR("--crit") },
  ], "hosts");

  barlist(mk(), "Top processes · in view",
          count(state.rows.filter((r) => r.kind !== "collector"), "process_name").slice(0, 6),
          CSSVAR("--accent"));
}

// ---------- rendering ----------

function renderTiles(fleet, hosts, merkle) {
  const unver = state.rows.filter((r) => r.verified === false).length;
  const crit = state.rows.filter((r) => r.severity === "CRITICAL").length;
  const mism = hosts.filter((h) => h.build_mismatch).length;
  const unanchored = merkle.roots_unanchored || 0;
  // A backlog is normal: a root waits up to --root-interval-secs, plus however
  // long the worker takes to confirm it. Hours of backlog is a stuck worker.
  const stale = (merkle.oldest_unanchored_age_secs || 0) > 3600;

  const defs = [
    ["Hosts", fleet.enrolled, ""],
    ["Silent", fleet.silent, fleet.silent > 0 ? "bad" : "good"],
    ["Records", fleet.total_records, ""],
    ["Chain breaks", fleet.total_breaks, fleet.total_breaks > 0 ? "bad" : "good"],
    ["Unsealed in view", unver, unver > 0 ? "bad" : "good"],
    ["Critical in view", crit, crit > 0 ? "bad" : ""],
    ["Build mismatch", mism, mism > 0 ? "bad" : "good"],
    ["Roots", merkle.roots || 0, ""],
    ["Unanchored", unanchored, stale ? "bad" : (unanchored > 0 ? "" : "good")],
  ];

  const box = $("tiles");
  box.replaceChildren();
  for (const [k, v, cls] of defs) {
    const t = el("div", "card tile");
    t.append(el("div", "k", k), el("div", "v " + cls, v));
    box.append(t);
  }

  const t = el("div", "card tile");
  t.append(el("div", "k", "Alerts · last hour"));
  sparkline(t);
  box.append(t);
}

/// What the commitment layer is doing, in one line.
///
/// textContent only, like everything else on this page: the strings below are
/// ours, but the habit is what keeps an attacker-chosen field from ever being
/// parsed as markup.
function renderAnchors(merkle) {
  const bar = $("anchorbar");
  if (!merkle || merkle.merkle === "off") {
    bar.textContent = "Merkle batching is off — records are stored but committed to nothing.";
    return;
  }
  const parts = [
    (merkle.batches || 0) + " batches",
    (merkle.roots || 0) + " roots",
    (merkle.batches_pending_root || 0) + " batches awaiting a root",
  ];
  const last = merkle.last_anchor;
  if (last) {
    parts.push("last anchor: root " + last.root_id + " " + last.status +
               " in block " + (last.block_number || "?") +
               " on " + (last.chain_name || last.chain_id) +
               " (" + String(last.tx).slice(0, 12) + "…)");
  } else {
    parts.push("nothing anchored yet — roots are sealed but not published");
  }
  if (merkle.roots_unanchored) {
    parts.push(merkle.roots_unanchored + " unanchored, oldest " +
               fmtAge(merkle.oldest_unanchored_age_secs));
  }
  const worker = merkle.anchor_worker;
  if (worker) {
    parts.push("worker balance " + fmtWei(worker.anchor_balance_wei) +
               (worker.balance_low ? " (LOW)" : "") +
               ", checked " + ago(worker.checked_at));
  } else {
    parts.push("anchor worker has never run against this data directory");
  }
  bar.textContent = "Commitments: " + parts.join("  ·  ");
}

function fmtAge(secs) {
  if (secs === null || secs === undefined) return "unknown";
  if (secs < 90) return secs + "s";
  if (secs < 5400) return Math.round(secs / 60) + "m";
  return Math.round(secs / 3600) + "h";
}

/// Wei as ETH, to four places. BigInt because 1e18 does not fit a double and a
/// balance rendered as 0.1000000000000000055 reads as a bug.
function fmtWei(wei) {
  try {
    const v = BigInt(wei || "0");
    const whole = v / 1000000000000000000n;
    const frac = (v % 1000000000000000000n) / 100000000000000n;
    return whole + "." + String(frac).padStart(4, "0") + " ETH";
  } catch (e) {
    return String(wei);
  }
}

function renderBanner(fleet, hosts, merkle) {
  const b = $("banner");
  const problems = [];
  if (fleet.total_breaks > 0) {
    problems.push(fleet.total_breaks + " chain break(s) recorded — evidence was altered, deleted, or forged");
  }
  if (fleet.silent > 0) {
    problems.push(fleet.silent + " host(s) silent — an agent stopped reporting");
  }
  const mism = hosts.filter((h) => h.build_mismatch);
  if (mism.length) {
    problems.push(mism.length + " host(s) running an unenrolled agent binary");
  }
  // Not data loss -- roots keep accumulating and anchor later -- but proofs
  // issued meanwhile carry no independent timestamp, so it has to be visible.
  if (merkle && (merkle.oldest_unanchored_age_secs || 0) > 3600) {
    problems.push("a root has been waiting " + fmtAge(merkle.oldest_unanchored_age_secs) +
                  " to be anchored — the anchor worker is stuck, unfunded, or not running");
  }
  if (merkle && merkle.anchor_worker && merkle.anchor_worker.balance_low) {
    problems.push("the anchor account is nearly out of gas");
  }
  if (problems.length) {
    b.textContent = "INTEGRITY ALERT: " + problems.join("  ·  ");
    b.classList.add("show");
  } else {
    b.classList.remove("show");
  }
}

function renderHosts(hosts) {
  const box = $("hosts");
  box.replaceChildren();

  const allRow = el("div", "host" + (state.host === "" ? " sel" : ""));
  const allName = el("div", "n");
  allName.append(el("span", null, "All hosts"));
  allRow.append(allName, el("div", "s", hosts.length + " enrolled"));
  allRow.onclick = () => { state.host = ""; refresh(); };
  box.append(allRow);

  for (const h of hosts) {
    const row = el("div", "host" + (state.host === h.host ? " sel" : ""));
    const name = el("div", "n");
    const dot = el("span", "dot " + (h.silent ? "stale" : "live"));
    name.append(dot, el("span", null, h.host));
    row.append(name);

    const bits = [ago(h.last_seen), "seq " + h.high_seq];
    if (h.breaks > 0) bits.push(h.breaks + " break(s)");
    if (h.build_mismatch) bits.push("build mismatch");
    row.append(el("div", "s", bits.join(" · ")));

    row.onclick = () => { state.host = h.host; refresh(); };
    box.append(row);
  }
}

function matchesQuery(r) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return ["process_name", "parent_process_name", "filename", "host", "event_type", "detail"]
    .some((k) => String(r[k] || "").toLowerCase().includes(q));
}

function renderRows() {
  const body = $("rows");
  body.replaceChildren();

  const shown = state.rows.filter(matchesQuery);
  $("count").textContent = shown.length + " shown";
  $("empty").hidden = shown.length > 0;

  for (const r of shown) {
    const tr = el("tr", r.verified === false ? "unver" : "");

    tr.append(el("td", null, shortTime(r.received_at)));
    tr.append(el("td", null, r.host));

    const sev = el("td");
    sev.append(el("span", "sev " + (r.severity || "INFO"), r.severity || "INFO"));
    tr.append(sev);

    // Collector markers have no process; show what happened instead.
    if (r.kind === "collector") {
      const td = el("td", null, r.event_type);
      td.colSpan = 2;
      tr.append(td);
    } else {
      tr.append(el("td", null, r.process_name));
      tr.append(el("td", null, r.parent_process_name));
    }

    tr.append(el("td", null, r.kind === "collector" ? "" : r.uid));
    tr.append(el("td", null, r.kind === "collector" ? "" : r.pid));
    tr.append(el("td", null, r.seq));

    const seal = el("td");
    seal.append(
      r.verified
        ? el("span", "badge y", "sealed")
        : el("span", "badge n", "UNSEALED")
    );
    tr.append(seal);

    tr.onclick = () => openDrawer(r);
    body.append(tr);
  }
}

const FIELDS = [
  ["Kind", "kind"], ["Host", "host"], ["Severity", "severity"],
  ["Received (collector clock)", "received_at"],
  ["Event time (host clock)", "timestamp"],
  ["Event", "event_type"], ["Detail", "detail"],
  ["Process", "process_name"], ["Parent", "parent_process_name"],
  ["Path", "filename"], ["Binary id", "binary_id"],
  ["UID", "uid"], ["PID", "pid"], ["PPID", "ppid"], ["cgroup", "cgroup_id"],
  ["Seq", "seq"], ["Epoch", "epoch"], ["Segment", "segment"],
  ["Expected seq", "expected_seq"], ["Expected prev hash", "expected_prev_hash"],
  ["Enrolled build", "expected_build"], ["Reported build", "reported_build"],
  ["MAC", "hash"], ["Prev MAC", "prev_hash"],
];

function openDrawer(r) {
  $("dtitle").textContent = r.kind === "collector"
    ? r.event_type + " · " + r.host
    : (r.process_name || "event") + " · " + r.host;

  const dl = $("dbody");
  dl.replaceChildren();

  const seal = el("dd");
  seal.append(r.verified ? el("span", "badge y", "MAC verified against escrowed K0")
                         : el("span", "badge n", "NOT VERIFIED — treat contents as attacker-controlled"));
  dl.append(el("dt", null, "Seal"), seal);

  for (const [label, key] of FIELDS) {
    const v = r[key];
    if (v === undefined || v === null || v === "") continue;
    dl.append(el("dt", null, label), el("dd", null, v));
  }
  $("drawer").classList.add("open");
}

// ---------- data ----------

async function refresh() {
  try {
    const params = new URLSearchParams();
    if (state.host) params.set("host", state.host);
    if (state.sev) params.set("severity", state.sev);
    // "true", not "1": serde_urlencoded only accepts the spelled-out form for
    // a bool, and a rejected query means the whole request 400s.
    if (state.all) params.set("all", "true");
    params.set("limit", "500");

    const [ov, al, mk] = await Promise.all([
      fetch("api/overview").then((r) => r.json()),
      fetch("api/alerts?" + params.toString()).then((r) => r.json()),
      // Never fatal: an older collector without the retrieval API still shows
      // its alerts rather than reporting itself unreachable.
      fetch("api/merkle/status").then((r) => r.json()).catch(() => ({})),
    ]);

    state.rows = Array.isArray(al.alerts) ? al.alerts : [];
    state.hosts = ov.hosts || [];
    renderHosts(state.hosts);
    renderTiles(ov.fleet || {}, state.hosts, mk || {});
    renderCharts(ov.fleet || {});
    renderAnchors(mk || {});
    renderBanner(ov.fleet || {}, state.hosts, mk || {});
    renderRows();

    $("updated").textContent = "updated " + shortTime(new Date().toISOString());
    $("pulse").className = "dot live";
  } catch (e) {
    // A dead collector must look dead, not look quiet.
    $("updated").textContent = "collector unreachable";
    $("pulse").className = "dot stale";
  }
}

// ---------- wiring ----------

$("refresh").onclick = refresh;
$("clear").onclick = () => { state.host = ""; refresh(); };
$("sev").onchange = (e) => { state.sev = e.target.value; refresh(); };
$("q").oninput = (e) => { state.q = e.target.value; renderRows(); };
$("close").onclick = () => $("drawer").classList.remove("open");
document.onkeydown = (e) => { if (e.key === "Escape") $("drawer").classList.remove("open"); };

$("all").onclick = (e) => {
  state.all = !state.all;
  e.target.classList.toggle("on", state.all);
  refresh();
};

let timer = null;
function setAuto(on) {
  state.auto = on;
  $("auto").classList.toggle("on", on);
  if (timer) clearInterval(timer);
  timer = on ? setInterval(refresh, 5000) : null;
}
$("auto").onclick = () => setAuto(!state.auto);

setAuto(true);
refresh();
</script>
</body>
</html>
