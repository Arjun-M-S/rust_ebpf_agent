[package]
name = "edr-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Internal
edr-agent-common = { path = "../edr-agent-common", features = ["user"] }
# Aya (Stable uses 'async_tokio')
aya = { workspace = true, features = ["async_tokio"] }
aya-log = { workspace = true }

# Utils
anyhow = { workspace = true, default-features = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Forward-secure sealing: HMAC for the record tag, SHA256 for key evolution,
# getrandom for K0. An unkeyed digest is recomputable by the root attacker the
# threat model assumes, so the key is what does the work here.
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"

# Shipper. rustls rather than the system OpenSSL: one fewer C dependency in a
# binary that runs as root, and no reliance on however the host was built.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# build.rs shells out to `cargo build` directly and uses only std,
# so it declares no build-dependencies.

[[bin]]
name = "edr-agent"
path = "src/main.rs"