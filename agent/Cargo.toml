# The agent half. Needs nightly + bpf-linker for the eBPF crate and root to
# run; none of that is the server's problem, which is why it has its own
# workspace, its own lockfile and its own .cargo/config.toml.
#
#     cd agent && cargo build --release
[workspace]
resolver = "2"
members = [
    "edr-agent",
    "edr-agent-common",
    "edr-agent-ebpf",
]
default-members = ["edr-agent", "edr-agent-common"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# --- STABLE AYA VERSIONS ---
aya = { version = "0.13", default-features = false }
aya-ebpf = { version = "0.1", default-features = false }      
aya-log = { version = "0.2", default-features = false }
aya-log-ebpf = { version = "0.1", default-features = false }

# The wire contract shared with the server half. Lives outside this workspace
# on purpose: neither component owns it.
edr-record = { path = "../protocol" }

# --- UTILS ---
anyhow = { version = "1", default-features = false }
clap = { version = "4", default-features = false, features = ["std"] }
env_logger = { version = "0.11", default-features = false }
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false }
which = { version = "6", default-features = false }
bytes = "1.5"

# SUP-4: aya-build and cargo_metadata were declared here but referenced by
# nothing. A dependency that is never used is still fetched, still compiled,
# and still executes build scripts, so it is attack surface for free.

# --- PROFILE SETTINGS ---
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"